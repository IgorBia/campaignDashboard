openapi: 3.0.3
info:
  title: Campaign Dashboard API
  version: 1.0.0
  description: |
    API for managing products and advertising campaigns for a global demo account.
servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Products
  - name: Campaigns
  - name: Dictionaries
  - name: Account

paths:
  /api/products:
    get:
      tags: [Products]
      summary: List products
      operationId: listProducts
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
    post:
      tags: [Products]
      summary: Create product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/products/{id}:
    put:
      tags: [Products]
      summary: Update product
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Products]
      summary: Delete product
      operationId: deleteProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Product deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns:
    get:
      tags: [Campaigns]
      summary: List campaigns for the global demo user
      operationId: listCampaigns
      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignResponse'
    post:
      tags: [Campaigns]
      summary: Create campaign
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
      responses:
        '201':
          description: Campaign created and new account balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessConflict'

  /api/campaigns/{id}:
    get:
      tags: [Campaigns]
      summary: Get campaign
      operationId: getCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Campaigns]
      summary: Update campaign
      operationId: updateCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignUpdateRequest'
      responses:
        '200':
          description: Campaign updated and new account balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BusinessConflict'
    delete:
      tags: [Campaigns]
      summary: Delete campaign
      description: Delete campaign and return its fund to the demo account balance.
      operationId: deleteCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign deleted and account balance updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDeleteResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/dictionaries/keywords:
    get:
      tags: [Dictionaries]
      summary: Keyword typeahead
      operationId: searchKeywords
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeywordResponse'

  /api/dictionaries/towns:
    get:
      tags: [Dictionaries]
      summary: List of towns for dropdown
      operationId: listTowns
      responses:
        '200':
          description: List of towns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TownResponse'

  /api/account:
    get:
      tags: [Account]
      summary: Emerald account balance (global demo)
      operationId: getAccount
      responses:
        '200':
          description: Account data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'

  /api/account/seed:
    post:
      tags: [Account]
      summary: Reset demo account balance (technical endpoint)
      operationId: seedAccount
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSeedRequest'
      responses:
        '200':
          description: Account reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Data validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BusinessConflict:
      description: Business rule error (e.g., insufficient funds)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    CampaignStatus:
      type: string
      enum: [ON, OFF]

    ProductCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    ProductUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    ProductResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CampaignCreateRequest:
      type: object
      required:
        [productId, name, keywordIds, bidAmount, campaignFund, status, townId, radiusKm]
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        keywordIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        bidAmount:
          type: number
          format: bigdecimal
          minimum: 0.01
        campaignFund:
          type: number
          format: bigdecimal
          minimum: 0
          exclusiveMinimum: true
        status:
          $ref: '#/components/schemas/CampaignStatus'
        townId:
          type: string
          format: uuid
        radiusKm:
          type: integer
          minimum: 1

    CampaignUpdateRequest:
      type: object
      required:
        [productId, name, keywordIds, bidAmount, campaignFund, status, townId, radiusKm]
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        keywordIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        bidAmount:
          type: number
          format: bigdecimal
          minimum: 0.01
        campaignFund:
          type: number
          format: bigdecimal
          minimum: 0
          exclusiveMinimum: true
        status:
          $ref: '#/components/schemas/CampaignStatus'
        townId:
          type: string
          format: uuid
        radiusKm:
          type: integer
          minimum: 1

    CampaignResponse:
      type: object
      required:
        [id, productId, name, keywords, bidAmount, campaignFund, status, town, radiusKm]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
        name:
          type: string
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/KeywordResponse'
        bidAmount:
          type: number
          format: bigdecimal
        campaignFund:
          type: number
          format: bigdecimal
        status:
          $ref: '#/components/schemas/CampaignStatus'
        town:
          $ref: '#/components/schemas/TownResponse'
        radiusKm:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CampaignMutationResponse:
      type: object
      required: [campaign, accountBalance]
      properties:
        campaign:
          $ref: '#/components/schemas/CampaignResponse'
        accountBalance:
          type: number
          format: bigdecimal

    CampaignDeleteResponse:
      type: object
      required: [deletedCampaignId, accountBalance]
      properties:
        deletedCampaignId:
          type: string
          format: uuid
        accountBalance:
          type: number
          format: bigdecimal

    KeywordResponse:
      type: object
      required: [id, value]
      properties:
        id:
          type: string
          format: uuid
        value:
          type: string

    TownResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    AccountResponse:
      type: object
      required: [id, balance, currency]
      properties:
        id:
          type: string
          format: uuid
        balance:
          type: number
          format: bigdecimal
        currency:
          type: string
          example: EMERALD

    AccountSeedRequest:
      type: object
      required: [balance]
      properties:
        balance:
          type: number
          format: bigdecimal
          minimum: 0

    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: campaignFund must be greater than zero
        details:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
